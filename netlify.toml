[build]
  publish = "public"
  functions = "netlify/functions"
  # node --check every function before deploying. A syntax error in a function
  # otherwise ships silently and only surfaces when a user hits the endpoint.
  command = "npm run check"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # lib/ is outside the functions directory, so it must be declared as included.
  included_files = ["lib/**"]

# Friendly API paths. The questionnaire calls /api/*, never /.netlify/functions/*.
[[redirects]]
  from = "/api/partner"
  to = "/.netlify/functions/partner-lookup"
  status = 200

[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit-assessment"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/get-portfolio"
  status = 200

[[redirects]]
  from = "/api/move"
  to = "/.netlify/functions/save-move"
  status = 200

[[redirects]]
  from = "/api/context"
  to = "/.netlify/functions/save-assessment-context"
  status = 200

[[redirects]]
  from = "/api/registry"
  to = "/.netlify/functions/get-brand-registry"
  status = 200

# The front door. Everything enters here; home.html forwards any ?code=
# straight to the questionnaire before painting, so issued coded links keep
# working unchanged. force=true because index.html would otherwise shadow it.
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

# Code-free links for demonstrations. 302 rather than 200 (rewrite) because the
# page reads the access code from the query string — a rewrite would keep the
# clean path in the address bar and the code would never reach the browser.
# These point at the DEMONSTRATION partner code only. Submissions on it land in
# the demo account, never in a client's.
[[redirects]]
  from = "/try"
  to = "/index.html?code=BRANDS-DEMO-P8W3"
  status = 302

# The demonstration dashboard: code-only account, opens straight from the link.
[[redirects]]
  from = "/try-dashboard"
  to = "/dashboard.html?code=BRANDS-DEMO-P8W3"
  status = 302

[[redirects]]
  from = "/try-brand"
  to = "/index.html?code=BRANDS-DEMO-P8W3"
  status = 302

[[redirects]]
  from = "/try-company"
  to = "/index.html?code=BRANDS-DEMO-P8W3&instrument=company"
  status = 302

[[redirects]]
  from = "/try-licensee"
  to = "/index.html?code=BRANDS-DEMO-P8W3&instrument=licensee"
  status = 302

[[redirects]]
  from = "/try-line"
  to = "/line.html?code=BRANDS-DEMO-P8W3"
  status = 302

[[redirects]]
  from = "/line"
  to = "/line.html"
  status = 200

# Clean URLs for the two human-facing pages. 200 = rewrite, the URL stays clean.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/marquee-demo.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200

# The portfolio dashboard must never be indexed or cached by intermediaries.
[[headers]]
  for = "/dashboard*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[dev]
  publish = "public"
  port = 8888
